<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D112B"/>
      <stop offset="100%" stop-color="#0B0A0E"/>
    </radialGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" stroke="rgba(244, 63, 94, 0.4)" stroke-width="8"/>

  <!-- Glowing Chaos Emblem (Stylized C & Crown & Flame) -->
  <g filter="url(#glow)">
    <!-- Central Crown & Flame -->
    <path d="M160 360 L140 220 L210 270 L256 160 L302 270 L372 220 L352 360 Z" fill="url(#flameGrad)" />
    <!-- Core Sparkle -->
    <circle cx="256" cy="140" r="16" fill="#FDE68A" />
    <circle cx="135" cy="205" r="12" fill="#FDA4AF" />
    <circle cx="377" cy="205" r="12" fill="#FDA4AF" />
    <!-- Dynamic Party Ribbon Curve -->
    <path d="M120 380 Q 256 420 392 380" stroke="url(#accentGrad)" stroke-width="20" stroke-linecap="round" />
  </g>
</svg>